<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Black market catalog</title>
    <link rel="stylesheet" href="style.css"></link>
    <style>
        body {
            background-image: url('fon1.jpg');
            background-size: cover;
            color: rgb(255, 102, 0);
        }
        
        ul {
            background-color: rgba(216, 231, 3, 0.6);
            color: rgb(9, 230, 156);
            padding: 30px 50px;
            border-radius: 20px;
            font-size: 50px;
            max-width: 3000px;
            list-style: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .logo {
            font-size: 40px;
            font-weight: bold;
            color: rgb(255, 102, 0);
        }
        
        .button a {
            color: rgb(247, 5, 5);
            font-size: 30px;
            font-weight: 400;
            text-decoration: none;
            background: rgba(0,0,0,0.5);
            padding: 10px 20px;
            border-radius: 10px;
        }
        
        .filter-panel {
            background: rgba(0,0,0,0.7);
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
            text-align: center;
        }
        
        .filter-panel h3 {
            color: rgb(255, 102, 0);
            font-size: 30px;
            font-weight: 400;
            font-style: italic;
        }
        
        .filter-input {
            width: 50%;
            padding: 12px;
            border: 1px solid #ddd;
            font-size: 18px;
        }
        
        hr {
            border: none;
            border-top: 3px solid #ec085f;
            margin: 20px 0;
            width: 100%;
        }
        
        footer {
            text-align: left;
            padding: 15px;
            background-color: rgba(0,0,0,0.7);
            color: rgb(57, 241, 11);
            font-size: 18px;
            width: 100%;
            font-weight: 400;
            margin-top: 30px;
        }
        
        hr.another {
            border: none;
            border-top: 3px solid #ec0895;
            margin: 20px 0;
            width: 100%;
        }
        
        .main-container {
            display: flex;
            margin-top: 20px;
        }
        
        .catalog-section {
            flex: 2;
        }
        
        .cart-section {
            flex: 1;
            background: rgba(0,0,0,0.7);
            padding: 20px;
            color: white;
            height: fit-content;
            top: 20px;
        }
        
        .cart-section h3 {
            font-size: 30px;
            font-weight: 400;
            font-style: italic;
        }
        
        .catalog {
            display: flex;
            justify-content: center;
            gap: 30px;
            padding: 20px;
        }
        
        .product-card {
            text-align: center;
            width: 250px;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 15px;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.3);
            background: rgba(0,0,0,0.6);
        }
        
        .product-card img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 8px;
        }
        
        .product-card h3 {
            font-size: 24px;
            font-weight: 400;
            font-style: italic;
        }
        
        .product-card h3 a {
            color: rgb(255, 102, 0);
            text-decoration: none;
        }
        
        .product-card h3 a:hover {
            text-decoration: underline;
        }
        
        .product-card p {
            font-size: 16px;
            font-weight: 400;
            font-style: italic;
            color: white;
        }
        
        .price {
            font-size: 20px;
            font-weight: 400;
            font-style: italic;
            color: rgb(9, 230, 156);
            font-weight: bold;
        }
        
        .add-to-cart {
            background: rgb(255, 102, 0);
            color: black;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 400;
            font-size: 16px;
            font-style: italic;
            margin-top: 10px;
        }
        
        h2 {
            text-align: center;
            color: rgb(255, 102, 0);
            font-size: 40px;
            font-weight: 400;
            font-style: italic;
        }
        
        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #555;
        }
        
        .cart-item-info {
            flex: 1;
        }
        
        .cart-item-name {
            font-size: 18px;
            font-weight: 400;
            font-style: italic;
        }
        
        .cart-item-price {
            font-size: 14px;
            font-weight: 400;
            font-style: italic;
            color: rgb(9, 230, 156);
        }
        
        .remove-item {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }
        
        .cart-total {
            margin-top: 15px;
            padding-top: 10px;
            border-top: 2px solid #ec085f;
            font-weight: bold;
            text-align: right;
            font-size: 20px;
            font-weight: 400;
            font-style: italic;
        }
        
        .cart-buttons {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        
        .pay-btn, .clear-cart-btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 400;
            font-size: 16px;
            font-style: italic;
        }
        
        .pay-btn {
            background: #2ecc71;
            color: white;
        }
        
        .clear-cart-btn {
            background: #95a5a6;
            color: white;
        }
        
        .empty-cart {
            text-align: center;
            color: #999;
            padding: 20px;
            font-size: 16px;
            font-weight: 400;
            font-style: italic;
        }
    </style>
</head>
<body>
    <header>
        <ul>
            <span class="logo">Black Market Catalog</span>
            <li class="button"><a href="index.html">Главная</a></li>
        </ul>
    </header>
    <hr>

    <div class="filter-panel">
        <h3>Фильтр товаров</h3>
        <input type="text" id="filterInput" class="filter-input" placeholder="Поиск по названию...">
    </div>

    <div class="main-container">
        <div class="catalog-section">
            <h2>Каталог товаров</h2>
            <div id="productsGrid" class="catalog"></div>
        </div>

        <div class="cart-section">
            <h3 style="text-align: center;">Корзина</h3>
            <div id="cartItems"></div>
            <div id="cartTotal" class="cart-total"></div>
            <div class="cart-buttons">
                <button id="clearCartBtn" class="clear-cart-btn">Очистить</button>
                <button id="payBtn" class="pay-btn"> Оплатить</button>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; Все права защищены! В случае разглашения места положения рынка, будет выполнен протокол устранения!</p>
    </footer>
    <hr class="another">
    <script src="script.js"></script>
    
</body>
</html>
